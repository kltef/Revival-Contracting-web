version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
    build:
      commands:
        # npm install, not npm ci: two Amplify packages bundle mismatched OpenTelemetry versions that npm ci rejects
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
