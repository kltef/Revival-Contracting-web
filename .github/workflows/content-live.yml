name: Website edit live check

# When Anthony merges a held website edit himself, confirm it reaches the live site.
# (Edits Claude publishes are checked inside the review workflow, because merges made with
# the workflow token don't start other workflows.)
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'content-change')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: two Amplify packages bundle mismatched OpenTelemetry versions that npm ci rejects
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/content-verify-live.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
