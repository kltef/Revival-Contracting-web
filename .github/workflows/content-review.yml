name: Website edit review

# Runs for pull requests the admin page's website editor opens (branches named content/...).
# pull_request_target runs this file and the scripts as they are on main, never as changed in the PR,
# so an edit can't rewrite its own review. Nothing from the PR is executed here; it's read through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: content-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: startsWith(github.event.pull_request.head.ref, 'content/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      decision: ${{ steps.review.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: two Amplify packages bundle mismatched OpenTelemetry versions that npm ci rejects
      - run: npm install --ignore-scripts --no-audit --no-fund
      - id: review
        run: node scripts/content-review.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  publish:
    needs: review
    if: needs.review.outputs.decision == 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: two Amplify packages bundle mismatched OpenTelemetry versions that npm ci rejects
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Wait for the build and tests to pass
        run: |
          for i in $(seq 1 60); do
            read -r status conclusion < <(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=build-and-test" \
              --jq '.check_runs | sort_by(.started_at) | last | "\(.status // "missing") \(.conclusion // "none")"')
            echo "build-and-test: $status $conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::The build or tests failed"; exit 1
            fi
            sleep 30
          done
          echo "::error::The build and tests didn't finish in 30 minutes"; exit 1

      - name: Approve and publish
        run: |
          gh pr review "$PR_NUMBER" --approve --body "Checked by Claude and the automatic tests." \
            || echo "::warning::Couldn't add an approving review (allow GitHub Actions to approve pull requests in Settings → Actions)."
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Confirm it's live
        id: verify
        run: node scripts/content-verify-live.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # (a failed live check posts its own message)
      - name: Ask a person to look if publishing failed
        if: failure() && steps.verify.conclusion != 'failure'
        run: |
          gh pr edit "$PR_NUMBER" --add-label needs-human
          gh pr comment "$PR_NUMBER" --body "<!-- content-status -->
          The automatic check passed, but this change couldn't be published automatically. Anthony has been asked to look at it, usually within a day.

          <details><summary>Details</summary>

          See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          </details>"
