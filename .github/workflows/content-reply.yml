name: Website edit messages

# When the editor writes a message on a change request from the admin page, Claude replies.
# issue_comment always runs this file as it is on the default branch.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: content-reply-${{ github.event.issue.number }}

jobs:
  reply:
    # Only messages the admin page posted (they start with the editor marker), on website-edit requests,
    # from an account with write access (the token the admin page uses).
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'content-change') &&
      startsWith(github.event.comment.body, '<!-- website-editor-message -->') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: two Amplify packages bundle mismatched OpenTelemetry versions that npm ci rejects
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/content-reply.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          PR_NUMBER: ${{ github.event.issue.number }}
