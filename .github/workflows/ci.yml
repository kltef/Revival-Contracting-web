name: CI

# Builds the site and runs every test. Website edits wait for this check before they can be published.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: two Amplify packages bundle mismatched OpenTelemetry versions that npm ci rejects
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Type-check the backend
        run: npx tsc --noEmit -p amplify/tsconfig.json
